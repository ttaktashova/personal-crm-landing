# Landing on the new domain. Temporary HTTP-only version until the certificate is issued.
server {
    listen 80;
    listen [::]:80;
    server_name testblacklist.ru www.testblacklist.ru;
    include snippets/landing-security-headers.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        root /var/www/landing;
        try_files $uri $uri/ =404;
    }
}
