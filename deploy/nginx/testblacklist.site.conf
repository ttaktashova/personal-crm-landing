# Landing: static files uploaded by GitHub Actions (repo personal-crm-landing) to /var/www/landing.
server {
    listen 80;
    listen [::]:80;
    server_name testblacklist.site;
    include snippets/landing-security-headers.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name testblacklist.site;
    include snippets/testblacklist-ssl.conf;
    include snippets/landing-security-headers.conf;

    location / {
        root /var/www/landing;
        try_files $uri $uri/ =404;
    }
}
