# Security headers of the landing. On the server: /etc/nginx/snippets/landing-security-headers.conf
# Included in every server block of the landing vhosts, at server level.
# A location with its own add_header drops all of these: include this file there too.

# The Server header and error pages say "nginx" without the version
server_tokens off;

# Browsers ignore HSTS over plain HTTP: it starts working once a domain has HTTPS.
# No includeSubDomains: the subdomains belong to the app, which sends its own.
add_header Strict-Transport-Security "max-age=63072000" always;

# Everything comes from the landing itself, except Google Fonts (stylesheet and font files).
# No nonces: inline scripts and styles are allowed, so the page stays a plain static file.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# For browsers that do not know frame-ancestors
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
# Only features Chrome knows: an unknown one is an error in the browser console
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
